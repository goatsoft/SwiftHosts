name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build Release App
        run: |
          xcodebuild -project SwiftHosts.xcodeproj \
            -scheme SwiftHosts \
            -configuration Release \
            -derivedDataPath .build/DerivedData \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Application Artifacts
        run: |
          mkdir -p dist
          ZIP_NAME="SwiftHosts-${{ github.ref_name }}.zip"
          cd .build/DerivedData/Build/Products/Release
          zip -r -9 "../../../../dist/$ZIP_NAME" "SwiftHosts.app"
          cd -
          cd dist
          shasum -a 256 "$ZIP_NAME" > SHA256SUMS.txt

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "SwiftHosts ${{ github.ref_name }}" \
            --generate-notes \
            dist/SwiftHosts-${{ github.ref_name }}.zip \
            dist/SHA256SUMS.txt
