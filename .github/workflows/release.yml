name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      CODE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Import Signing Certificate (if available)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            KEYCHAIN="$RUNNER_TEMP/swifthosts.keychain-db"
            security create-keychain -p "" "$KEYCHAIN"
            security set-key-chain-settings "$KEYCHAIN"
            security unlock-keychain -p "" "$KEYCHAIN"
            printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
            security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
            rm -f "$RUNNER_TEMP/cert.p12"
          else
            echo "No signing certificate provided; continuing in ad-hoc mode."
          fi

      - name: Validate Signing Configuration (if enabled)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            python3 scripts/check-release-signing.py
          fi

      - name: Build Release App
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            xcodebuild -project SwiftHosts.xcodeproj \
              -scheme SwiftHosts \
              -configuration Release \
              -derivedDataPath .build/DerivedData \
              -destination 'platform=macOS,arch=arm64' \
              ARCHS=arm64 \
              ENABLE_HARDENED_RUNTIME=YES \
              CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="${CODE_SIGN_IDENTITY}" \
              DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM}" \
              OTHER_CODE_SIGN_FLAGS="--timestamp" \
              build
          else
            xcodebuild -project SwiftHosts.xcodeproj \
              -scheme SwiftHosts \
              -configuration Release \
              -derivedDataPath .build/DerivedData \
              -destination 'platform=macOS,arch=arm64' \
              ARCHS=arm64 \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Verify Signed Artifact (if signed)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            python3 scripts/check-release-signing.py --verify .build/DerivedData/Build/Products/Release/SwiftHosts.app
          fi

      - name: Package DMG & ZIP Releases
        run: |
          DIST_DIR="$(pwd)/dist"
          mkdir -p "$DIST_DIR"
          VERSION="${RELEASE_TAG#v}"
          
          # Build DMG image
          DIST="$DIST_DIR" ./scripts/package-dmg.sh
          
          # Build ZIP archive
          ZIP_NAME="SwiftHosts-${RELEASE_TAG}.zip"
          cd .build/DerivedData/Build/Products/Release
          zip -r -9 "$DIST_DIR/$ZIP_NAME" "SwiftHosts.app"
          cd -
          
          # Generate Checksums
          cd "$DIST_DIR"
          shasum -a 256 "SwiftHosts-${VERSION}.dmg" "$ZIP_NAME" > SHA256SUMS.txt

      - name: Notarize Official DMG Release (if credentials present)
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTIFACT: "dist/SwiftHosts-${RELEASE_TAG#v}.dmg"
        run: ./scripts/notarize.sh

      - name: Create GitHub Release
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release create "${RELEASE_TAG}" \
            --title "SwiftHosts ${RELEASE_TAG}" \
            --generate-notes \
            "dist/SwiftHosts-${VERSION}.dmg" \
            "dist/SwiftHosts-${RELEASE_TAG}.zip" \
            dist/SHA256SUMS.txt

      - name: Clean Temporary Keychains
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          if [ -f "$RUNNER_TEMP/swifthosts.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/swifthosts.keychain-db"
          fi
